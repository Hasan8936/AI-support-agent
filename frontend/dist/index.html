<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AmazonHelp — Support Triage Demo</title>
    <style>
         :root {
            --bg: #f3f4f6;
            --panel: #ffffff;
            --panel-alt: #f8fafc;
            --text: #111827;
            --muted: #6b7280;
            --line: #e5e7eb;
            --brand: #f59e0b;
            --brand-deep: #b45309;
            --success-bg: #dcfce7;
            --success-fg: #166534;
            --danger-bg: #fee2e2;
            --danger-fg: #991b1b;
            --shadow: 0 10px 28px rgba(17, 24, 39, 0.06);
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Arial, sans-serif;
            line-height: 1.5;
        }
        
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }
        
        .brand-mark {
            width: 12px;
            height: 12px;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--brand), var(--brand-deep));
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.12);
        }
        
        .tag {
            font-size: 12px;
            color: var(--brand-deep);
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 999px;
            padding: 6px 10px;
            font-weight: 600;
        }
        
        .layout {
            display: grid;
            grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
            gap: 20px;
        }
        
        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 20px;
        }
        
        .panel-label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }
        
        textarea {
            width: 100%;
            min-height: 148px;
            resize: vertical;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px 16px;
            font: inherit;
            color: var(--text);
            background: var(--panel-alt);
        }
        
        textarea:focus,
        button:focus {
            outline: 3px solid rgba(59, 130, 246, 0.25);
            outline-offset: 2px;
        }
        
        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        
        button {
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        
        button:hover {
            transform: translateY(-1px);
        }
        
        .primary {
            background: var(--text);
            color: white;
        }
        
        .secondary {
            background: #f3f4f6;
            color: var(--text);
        }
        
        .result-grid {
            display: grid;
            gap: 16px;
        }
        
        .result-card {
            border: 1px solid var(--line);
            background: var(--panel);
            border-radius: 14px;
            padding: 18px;
        }
        
        .result-card h3 {
            margin: 0 0 12px;
            font-size: 14px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
        }
        
        .metric-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }
        
        .value {
            font-weight: 700;
        }
        
        .pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }
        
        .auto {
            background: var(--success-bg);
            color: var(--success-fg);
        }
        
        .escalate {
            background: var(--danger-bg);
            color: var(--danger-fg);
        }
        
        .precedent-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 10px;
        }
        
        .precedent-list li {
            background: #f8fafc;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
        }
        
        .similarity {
            display: inline-block;
            margin-top: 6px;
            color: var(--muted);
            font-size: 12px;
        }
        
        .error {
            border: 1px solid rgba(153, 27, 27, 0.25);
            background: rgba(254, 226, 226, 0.4);
            color: var(--danger-fg);
            border-radius: 12px;
            padding: 12px 14px;
        }
        
        @media (max-width: 820px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
  <script type="module" crossorigin src="/assets/index-B7iwqbaD.js"></script>
</head>

<body>
    <main>
        <header class="header">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"></span>
                <span>AmazonHelp support triage</span>
            </div>
            <span class="tag">Prototype / evaluation demo</span>
        </header>

        <div class="layout">
            <section class="card" aria-label="Message input panel">
                <label for="message" class="panel-label">Customer message</label>
                <textarea id="message" aria-label="Customer message">My package is late and I need an update.</textarea>

                <div class="button-row">
                    <button id="run" class="primary" type="button">Run agent</button>
                    <button id="sample" class="secondary" type="button">Load example</button>
                </div>
            </section>

            <section id="output" class="result-grid" aria-live="polite"></section>
        </div>
    </main>

</body>

</html>
